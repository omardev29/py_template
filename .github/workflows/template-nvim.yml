# CI of the template repository only (the template- prefix keeps it out of projects made
# with ./deploy new): the LazyVim integration, headless, in an isolated LazyVim (XDG_* under
# a temp dir). For each preset it creates a project, trusts its .lazy.lua through Neovim's
# API, installs the plugins and runs .pytemplate/nvim/tests/smoke.lua.
name: template-nvim

on:
  push:
    branches: [main]
    paths:
      - ".lazy.lua"
      - ".pytemplate/**"
      - "deploy*"
      - "pytemplate.toml"
      - ".github/workflows/template-nvim.yml"
  pull_request:
    paths:
      - ".lazy.lua"
      - ".pytemplate/**"
      - "deploy*"
      - "pytemplate.toml"
      - ".github/workflows/template-nvim.yml"
  workflow_dispatch:

jobs:
  nvim:
    name: nvim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Neovim version
        run: nvim --version
      # venv-selector (LazyVim's lang.python extra) raises an error on the first Python buffer
      # without fd, which fails every smoke check that opens one. Ubuntu names it fdfind.
      - name: fd
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install fd -y --no-progress; else sudo apt-get update && sudo apt-get install -y fd-find; fi
      - name: Runner environment
        run: ./deploy setup
      - name: LazyVim smoke test (script, raylib, flet)
        env:
          # short work dir outside the checkout (Windows MAX_PATH; no .lazy.lua above it).
          # The runner context exists only at step level, not in the job's env.
          PT_NVIM_DIR: ${{ runner.temp }}/pt-nvim
        run: ./deploy selftest --nvim --require --dir "$PT_NVIM_DIR"
      - name: Logs of the smoke test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nvim-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/pt-nvim/logs
          if-no-files-found: ignore
