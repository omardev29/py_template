# Test suite of the TEMPLATE repository (not rendered, and `./pyt new` does not copy
# template-*.yml workflows): `./pyt selftest` (pytest + mypy --strict of the runner, whose
# sys.platform branches mypy checks on the OS it runs on) on macOS and Windows, with the shells
# and tools its tests look for, so few of them skip, and the whole suite with the oldest uv
# pyproject.toml accepts (envs.MIN_UV). The Linux jobs (selftest, the runner's tests on its floor
# Python 3.11, and the suite inside projects made with `./pyt new`) run in the CI image:
# template-ci-image.yml. Weekly without a push as well (the newest uv, Python patch releases and
# runner images), kept enabled by template-keepalive.yml. The gate job skips everything in
# repositories made from the template.
name: template-selftest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1" # weekly, Monday 05:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.marker.outputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .pytemplate/template-repo
          sparse-checkout-cone-mode: false
      - id: marker
        run: if [ -f .pytemplate/template-repo ]; then echo "template=true" >> "$GITHUB_OUTPUT"; fi

  selftest:
    name: selftest (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.template == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # Windows keeps git's default core.autocrlf (CRLF checkouts, like a Windows developer's)
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # First, before any command renders: a generated file committed stale fails here
      - name: Generated files match their sources
        run: ./pyt render --check
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with: {msystem: UCRT64, release: false, update: false, path-type: minimal, install: dash}
      # A login MSYS2 shell has a minimal PATH: the launcher must find uv in a standard folder
      - name: uv also in %USERPROFILE%\.local\bin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$HOME\.local\bin" | Out-Null; Copy-Item (Get-Command uv).Source "$HOME\.local\bin\"
      - name: xonsh (pinned; template-launchers follows the newest on its schedule)
        run: |
          uv tool install --python 3.14 xonsh==0.24.2
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Runner environment
        run: ./pyt setup
      - name: Tool versions
        run: |
          uv --version; nvim --version | sed -n 1p; pwsh --version || true; node --version || true
      # test_upx's real run takes the UPX upx.find finds: the pinned download (SHA-256 checked) on
      # Windows, as in the CI image (macOS has none: upx does not support it)
      - name: The pinned UPX in the runner's cache (Windows)
        if: runner.os == 'Windows'
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python
          "$py" -c "import sys; sys.path.insert(0, '.pytemplate'); from runner import config, upx; print(upx.find(config.load(set())))"
      - name: selftest (macOS)
        if: runner.os == 'macOS'
        run: ./pyt selftest -rs
      - name: selftest (Windows, through pyt.ps1; short temp paths for MAX_PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./pyt.ps1 selftest -rs "--basetemp=$env:RUNNER_TEMP\pt"; exit $LASTEXITCODE

  uv-floor:
    name: selftest with the oldest supported uv
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # the oldest uv that satisfies required-version in pyproject.toml
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          resolution-strategy: lowest
      - name: uv is envs.MIN_UV
        run: |
          want=$(sed -n 's/^MIN_UV = "\([0-9.]*\)".*/\1/p' .pytemplate/runner/envs.py)
          uv --version
          test -n "$want" && test "$(uv --version | cut -d' ' -f2)" = "$want"
      - name: Runner environment
        run: ./pyt setup
      # After a preset round trip uv 0.10.12 writes redundant markers into uv.lock (0.12 does
      # not): the same lock, other bytes, which only that test's byte comparison notices
      - name: selftest
        run: ./pyt selftest -rs --deselect .pytemplate/tests/test_presets.py::test_init_round_trip_through_every_preset_is_byte_identical
