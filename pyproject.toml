[project]
name = "myapp"
version = "0.1.0"
description = "Multi-backend uv template: CPython, PyPy and mypyc"
readme = "README.md"
# Managed by ./pyt from pytemplate.toml: ">=3.11" if PyPy is supported
requires-python = ">=3.14"
dependencies = [
    "mypy-extensions>=1.1.0",
    "rich>=15.0.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
# CPython-only tools: mypy depends on ast-serialize (Rust, no wheels for
# PyPy) and PyInstaller does not support PyPy. The PyPy environment only gets pytest.
dev = [
    "debugpy>=1.8.22; implementation_name == 'cpython'",
    "mypy>=2.3.1; implementation_name == 'cpython'",
    "pyinstaller>=6.22.3; implementation_name == 'cpython'",
    "pytest>=9.1",
    "ruff>=0.15; implementation_name == 'cpython'",
    "setuptools>=84.0.0; implementation_name == 'cpython'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.uv]
# >>> pytemplate: generated from pytemplate.toml by ./pyt; do not edit up to the closing marker
# uv.lock only resolves for the pinned minor version (e.g. without the 3.15 branch, where
# libraries such as raylib have no wheels yet). To change it: python.cpython + ./pyt lock
environments = [
    "implementation_name == 'cpython' and python_full_version >= '3.14' and python_full_version < '3.15'",
]
required-version = ">=0.10.12"
python-preference = "only-managed"  # <<< pytemplate
