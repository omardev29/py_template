# Keeps the scheduled workflows of the TEMPLATE repository running (the template- prefix keeps
# it out of projects made with ./deploy new). In a public repository GitHub disables a workflow
# with a schedule after 60 days without repository activity, and a disabled workflow does not
# run at all, not even on a push, until someone enables it again. Every week this job enables,
# through the REST API, each template-*.yml whose triggers include `schedule:` (itself too),
# which restarts that 60-day clock (the technique of liskin/gh-workflow-keepalive; GitHub shows
# no such clock, so it rests on observed behaviour); one disabled by hand (disabled_manually) is
# left alone. No secret: the job's GITHUB_TOKEN with `actions: write`.
# If it ever stops (Actions shows "This scheduled workflow is disabled"), enable it in the
# Actions tab or with `gh workflow enable template-keepalive.yml`, then run it once.
name: template-keepalive

on:
  schedule:
    - cron: "11 3 * * 1" # weekly, Monday 03:11 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.marker.outputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .pytemplate/template-repo
          sparse-checkout-cone-mode: false
      - id: marker
        run: if [ -f .pytemplate/template-repo ]; then echo "template=true" >> "$GITHUB_OUTPUT"; fi

  keepalive:
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows
      - name: Enable every scheduled template workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=0
          failed=0
          for file in .github/workflows/template-*.yml; do
            grep -q '^  schedule:' "$file" || continue
            name=${file##*/}
            count=$((count + 1))
            if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$name" --jq .state); then
              echo "::error::$name: GitHub could not return this workflow (not on the default branch yet?)"
              failed=1
              continue
            fi
            if [ "$state" = disabled_manually ]; then
              echo "$name: disabled by hand, left alone"
              continue
            fi
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$name/enable"
            echo "$name: enabled (was $state)"
          done
          echo "$count scheduled workflow(s)"
          test "$count" -gt 0 && test "$failed" = 0
