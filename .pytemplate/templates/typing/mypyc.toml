# Typing profile "mypyc": the strictest one. Applied only with backend.active = "mypyc"
# (and always in `./deploy check mypyc`, `test mypyc` and `build mypyc`).
#
# ./deploy turns these variants into .mypy.ini, pyrightconfig.json, .ruff.toml and
# .vscode/settings.json. You can edit them here; never edit the generated files.
#
# Why so strict: mypyc compiles your types to C. Wherever there is Any (or a global without
# Final) it emits generic operations, which can be SLOWER than uncompiled CPython.

description = "Typing required across src/; Any forbidden in compiled modules"
blocking = true

# -> global [mypy] section (all of src/ and tests/)
[mypy]
strict = true
warn_unreachable = true
strict_equality_for_none = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "explicit-override",
    "exhaustive-match",
    "deprecated",
    "mutable-override",
    "unused-awaitable",
    "redundant-self",
    "unimported-reveal",
]

# -> [mypy-<module>.*] for each module in compile.modules
[mypy_compiled]
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true

# -> pyrightconfig.json (Pylance)
[pyright]
typeCheckingMode = "standard"
# mypy owns `# type: ignore[code]`; pyright only honors `# pyright: ignore[rule]`
enableTypeIgnoreComments = false
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnreachable = "warning"

# Compiled paths -> pyright's "strict" list
[pyright_compiled]
strict = true

# Only with typing.editor = "basedpyright": flags Any in the editor too
[basedpyright_compiled]
reportAny = "error"
reportExplicitAny = "error"

# -> .ruff.toml
[ruff]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "ANN", "PLW0603"]
# mypy decides ANN401 (Any in signatures) per module; RUF001-003 flag legitimate non-ASCII text
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]
exit_zero = false

# -> .vscode/settings.json
[vscode]
"mypy-type-checker.severity" = { error = "Error", note = "Information" }
