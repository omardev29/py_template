# Typing profile "off": no typing requirements. The default for CPython/PyPy.
# Only real errors are checked: syntax and undefined names.

description = "No type checking: only syntax errors and undefined names"
blocking = false
skip_mypy = true

[mypy]
ignore_errors = true

[pyright]
typeCheckingMode = "off"

[ruff]
select = ["E9", "F63", "F7", "F82"]
ignore = []
exit_zero = false

[vscode]
