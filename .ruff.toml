# GENERATED by ./pyt from pytemplate.toml and .pytemplate/templates: do not edit by hand
# Typing profile: off

target-version = "py314"
line-length = 100
src = ["src", "tests"]
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "./__pypackages__", "./_build", "./buck-out", "./dist", "./node_modules", "./site-packages", "./venv"]
extend-exclude = ["./.build", "./dist", "./.pytemplate", "./typings"]

[lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []

[format]
docstring-code-format = true
