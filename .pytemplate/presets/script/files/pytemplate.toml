# pytemplate.toml: project configuration and working "mode".
#
# Change a value and run any ./deploy command: the generated files (.mypy.ini,
# pyrightconfig.json, .ruff.toml, .vscode/) update themselves. Whatever affects
# uv.lock (backend.supported, [python]) is applied with `./deploy lock`, or change it
# directly with `./deploy mode`.
schema = 1

[app]
name = "{{name}}"   # executable name; the Python package is src/{{pkg}}/
preset = "script"   # script | raylib | flet   (to switch: ./deploy init <preset>)
gui = false         # true: executable without a console and launchers with pythonw/pypyw
assets = ""         # folder inside src/ that is packaged with the app ("" = none)

[backend]
# cpython: the usual interpreter. No typing requirements.
# pypy:    JIT compiler. Best for pure Python and cffi libraries (raylib). 3.11 syntax.
# mypyc:   compiles compile.modules to C (AOT). Strict typing; Any forbidden in compiled code.
active = "cpython"
supported = ["cpython", "mypyc"]   # to add PyPy: ./deploy mode --supports +pypy

[python]
cpython = "3.14"        # minor version; uv manages the patch
pypy = "pypy@3.11.15"   # EXACT: PyPy 8.0 changed the ABI (pp80) and there are no wheels for it yet
jit = false             # experimental CPython JIT (run/test/portable only; needs python.org)

[typing]
profile = "auto"     # auto: "mypyc" on the mypyc backend; on cpython/pypy, whatever `relaxed` says
relaxed = "off"      # off | warn | strict   (typing with cpython/pypy)
editor = "pylance"   # pylance | basedpyright (the latter also flags Any in the editor)

[compile]
modules = ["{{pkg}}.core"]   # what mypyc compiles: packages or modules of src/
exclude = []                 # modules inside those packages that stay interpreted
forbid_imports = []          # imports forbidden in compiled code (e.g. UI libraries)
annotate = false             # HTML report of slow lines on every compile (or ./deploy report)
opt_level = "3"

[deploy]
optimize = 1   # 0 | 1 | 2: bytecode -O level; with >= 1 mypyc also strips asserts
default = { cpython = "exe", mypyc = "exe", pypy = "portable" }   # ./deploy build method
exclude_modules = []   # never bundled by exe/nuitka even if imported, e.g. "ssl" without HTTPS

[deploy.exe]
mode = "onefile"   # onefile | onedir (onedir starts faster and is not unpacked every time)
console = "auto"   # auto (= not app.gui) | yes | no
icon = ""          # path to an .ico
strip = false   # Linux/macOS: strip symbol tables of the bundled binaries (smaller)

[deploy.portable]
runtime = "bundled"   # bundled: the folder includes the interpreter | system: uses the target's

[deploy.pyz]
targets = ["host"]    # add keys like "cp314-linux-x86_64" to include native binaries for other OSes

[deploy.upx]
# UPX packs the exe/dll/pyd (and ELF executables) of the exe, nuitka, portable and flet methods:
# smaller files; every start unpacks them in memory and some antivirus engines flag them.
# Binaries over 600 MiB are never packed (UPX's limit is 768 MiB). Downloaded once (pinned).
enabled = false
level = "best"   # 1..9 | best | brute | ultra-brute (brute: much slower, a few % smaller)
lzma = true      # smaller, slower to unpack (PyInstaller and Nuitka always use LZMA)
exclude = []     # extra file-name globs never packed (C runtime and python3*.dll never are)

[hooks]
pre_commit = true   # ./deploy setup installs a git pre-commit hook (./deploy hooks run: ruff, format, generated files, lock)

[vscode]
# Status bar buttons (VS Code extension actboy168.tasks): ./deploy commands or [tasks] names
buttons = ["run", "test", "check", "build"]

# Custom Justfile-style recipes: ./deploy <name> [args...]
[tasks.ci]
help = "Same as CI: check and tests on every backend"
deps = ["check all", "test all"]
