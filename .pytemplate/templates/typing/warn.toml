# Typing profile "warn": types are optional and problems are reported as WARNINGS.
# Never blocks `./deploy check` or `build`. Enable it with typing.relaxed = "warn".

description = "Optional types; problems are shown as warnings and never block"
blocking = false

[mypy]
check_untyped_defs = true
enable_error_code = ["possibly-undefined", "deprecated"]
report_deprecated_as_note = true

[pyright]
typeCheckingMode = "standard"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportPossiblyUnbound = "warning"
reportRedeclaration = "warning"
reportGeneralTypeIssues = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportOperatorIssue = "warning"

[ruff]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
exit_zero = true

[vscode]
"mypy-type-checker.severity" = { error = "Warning", note = "Information" }
