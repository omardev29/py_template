# GENERATED by ./deploy from pytemplate.toml and .pytemplate/templates: do not edit by hand
#
# CI: on Windows, Linux and macOS it runs the same commands as on your machine
# (./deploy setup, check, test) and builds one .pyz per OS. mypyc does not compile for
# other OSes, so each runner contributes its binaries and the "pyz" job merges them into
# a single .pyz that uses the binary for each OS (and the .py on any other interpreter).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backends: "cpython mypyc"
          - os: windows-latest
            backends: "cpython mypyc"
          - os: macos-latest
            backends: "cpython mypyc"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Backend environments
        run: ./deploy setup
      - name: Types and lint (typing profile of each backend)
        run: ./deploy check all
      - name: Tests on every backend
        run: for b in ${{ matrix.backends }}; do ./deploy test "$b" || exit 1; done
      - name: pyz with the compiled core for this OS
        run: ./deploy build mypyc --method pyz --no-check
      - uses: actions/upload-artifact@v4
        with:
          name: pyz-${{ matrix.os }}
          path: dist/myapp-mypyc-pyz/myapp.pyz

  pyz:
    name: cross-platform pyz
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: pyz-parts
      - name: Merge the binaries of every OS into a single .pyz
        run: ./deploy --no-render pyz-merge pyz-parts/*/*.pyz --out dist/myapp.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: myapp-pyz
          path: dist/myapp.pyz
