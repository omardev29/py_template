# Flet builds of the TEMPLATE repository (the template- prefix keeps this workflow and its folder
# out of the projects ./pyt new creates, and the gate job skips everything in repositories made
# from the template): a project of the flet preset, made with ./pyt new as a user makes it, built
# with `./pyt build cpython --method flet` on Linux for two targets (template-flet/check.py):
#   web      [deploy.flet] target = "web": the static site is served over HTTP and opened in a
#            headless Chromium (Playwright, pinned in template-flet/browser.txt). The app's
#            Python must start in the browser (Pyodide), show the skeleton's controls and window
#            title, and draw when its button is clicked (the core then runs in Pyodide's event
#            loop: a browser starts no process). The console log and a screenshot are uploaded.
#   android  target = "apk": built, never run (an owner decision); the .apk must be a valid,
#            signed zip with the manifest, the Flutter and Python runtimes of every ABI, the app
#            and the native modules of its dependencies. It is uploaded for a few days.
# The jobs run on bare runners: the Android SDK and the JDKs are part of the runner image, and
# Flet installs its own Flutter (~3 GB), cached per Flet version with its other downloads (saved
# right after a build that passed, so a red check keeps them). A failed build prints Flutter's
# or Gradle's output in the job's log.
# On pushes to main and pull requests that touch what a flet build depends on, weekly and by
# hand: Flet pins Flutter and the Python and Pyodide builds it bundles, but its package index
# (pypi.flet.dev), the CDNs the web app loads from, Gradle's repositories and the runner image
# move, so a red scheduled run with no commit behind it means upstream drift.
# template-keepalive.yml keeps the schedule alive.
name: template-flet

on:
  push:
    branches: [main]
    paths:
      - ".pytemplate/runner/methods/flet.py"
      - ".pytemplate/runner/methods/common.py"
      - ".pytemplate/runner/cmd_build.py"
      - ".pytemplate/presets/flet/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/template-flet.yml"
      - ".github/workflows/template-flet/**"
  pull_request:
    paths:
      - ".pytemplate/runner/methods/flet.py"
      - ".pytemplate/runner/methods/common.py"
      - ".pytemplate/runner/cmd_build.py"
      - ".pytemplate/presets/flet/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/template-flet.yml"
      - ".github/workflows/template-flet/**"
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.marker.outputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .pytemplate/template-repo
          sparse-checkout-cone-mode: false
      - id: marker
        run: if [ -f .pytemplate/template-repo ]; then echo "template=true" >> "$GITHUB_OUTPUT"; fi

  web:
    name: flet build web, run in Chromium
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: A new flet project, as a user makes it
        run: ./pyt new "$RUNNER_TEMP/pt-flet" --preset flet
      - name: Runner environment
        working-directory: ${{ runner.temp }}/pt-flet
        run: ./pyt setup
      - name: "[deploy.flet] target = web"
        run: uv run --no-project --python 3.14 python .github/workflows/template-flet/check.py target "$RUNNER_TEMP/pt-flet" web
      - id: flet
        name: The Flet version the project locks (the cache key)
        run: uv run --no-project --python 3.14 python .github/workflows/template-flet/check.py flet "$RUNNER_TEMP/pt-flet" >> "$GITHUB_OUTPUT"
      # Flet's Flutter SDK, the pub packages and Flet's own downloads (the build template, the
      # Python builds): Flet pins all of them, so its version names them
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.flet/cache
          key: template-flet-web-${{ runner.os }}-${{ runner.arch }}-flet-${{ steps.flet.outputs.version }}
      - name: ./pyt build cpython --method flet
        working-directory: ${{ runner.temp }}/pt-flet
        run: ./pyt build cpython --method flet
      # Saved once the build passed, before the checks: a red check keeps a cold build's downloads
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.flet/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: The pinned Playwright's headless Chromium
        run: uv run --no-project --python 3.14 --with-requirements .github/workflows/template-flet/browser.txt python -m playwright install --with-deps --only-shell chromium
      - name: The web app in the browser
        run: uv run --no-project --python 3.14 --with-requirements .github/workflows/template-flet/browser.txt python .github/workflows/template-flet/check.py web "$RUNNER_TEMP/pt-flet" "$RUNNER_TEMP/browser"
      - name: Upload the browser's console log and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flet-web-browser
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore

  android:
    name: flet build apk, built only
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # The JDK Flet asks for (JAVA_HOME with a javac 17; else it downloads one) and the Android
      # Gradle plugin of its template accepts; the image's Android SDK (ANDROID_HOME) has the
      # platforms, build tools and NDK that Flet's Flutter asks for
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Disk space for Flutter, Gradle and three ABIs
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: A new flet project, as a user makes it
        run: ./pyt new "$RUNNER_TEMP/pt-flet" --preset flet
      - name: Runner environment
        working-directory: ${{ runner.temp }}/pt-flet
        run: ./pyt setup
      - name: "[deploy.flet] target = apk"
        run: uv run --no-project --python 3.14 python .github/workflows/template-flet/check.py target "$RUNNER_TEMP/pt-flet" apk
      - id: flet
        name: The Flet version the project locks (the cache key)
        run: uv run --no-project --python 3.14 python .github/workflows/template-flet/check.py flet "$RUNNER_TEMP/pt-flet" >> "$GITHUB_OUTPUT"
      # As for the web, plus Gradle's downloads (Flet's Android template pins its versions)
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.flet/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: template-flet-android-${{ runner.os }}-${{ runner.arch }}-flet-${{ steps.flet.outputs.version }}
      - name: ./pyt build cpython --method flet
        working-directory: ${{ runner.temp }}/pt-flet
        run: ./pyt build cpython --method flet
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.flet/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: What the .apk holds
        run: uv run --no-project --python 3.14 python .github/workflows/template-flet/check.py apk "$RUNNER_TEMP/pt-flet"
      - name: Its signature and manifest (the Android SDK's build tools)
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=$(find "$RUNNER_TEMP/pt-flet/dist/pt-flet-cpython-flet-apk" -name '*.apk')
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code):"
      - name: Upload the .apk (also when a check above failed)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flet-apk
          path: ${{ runner.temp }}/pt-flet/dist/pt-flet-cpython-flet-apk
          retention-days: 3
          if-no-files-found: ignore
