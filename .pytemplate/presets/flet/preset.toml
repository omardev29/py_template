description = "Desktop app with Flet: interpreted UI + core compiled with mypyc"

# flet and flet-desktop pinned to the SAME version: if they differ, Flet auto-installs
# flet-desktop with pip at runtime (bypassing uv.lock)
dependencies = ["flet=={version}", "flet-desktop=={version}"]
dev_dependencies = ["flet-cli=={version}"]

# Extra pyproject.toml tables (read by `flet build`)
pyproject = """
[tool.flet]
org = "com.example"
product = "{{name}}"
company = "{{name}}"
copyright = "Copyright (C) {{name}}"

[tool.flet.app]
path = "src"
module = "main"
"""

# Default values of [preset.flet] in pytemplate.toml
[options]
version = "1.0.1"
