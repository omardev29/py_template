# Launcher matrix of the TEMPLATE repository (not rendered, and `./pyt new` does not copy
# template-*.yml workflows): ./pyt, pyt.cmd and pyt.ps1 through every shell the
# runners have, with `./pyt selftest --shells` (T1 argv, T2 exit code, T3 cwd, T4 the
# xonsh-shell-kit route, T5 minimal PATH, T6 stdin, T7 install hints) plus the invocations a
# user types, on macOS and Windows (and WSL). The Linux job, with shellcheck, runs in the CI
# image: template-ci-image.yml. The runner's test suite runs in template-selftest.yml. The
# shells come from the runner images and their package managers (the newest of each), except
# xonsh, pinned for pushes and pull requests; the weekly run takes the newest xonsh too, so a
# red scheduled run with no commit behind it means a shell changed (the versions are logged).
# template-keepalive.yml keeps the schedule alive. The gate job skips everything in
# repositories made from the template.
name: template-launchers

on:
  push:
    paths: [pyt, pyt.cmd, pyt.ps1, ".pytemplate/**", ".github/workflows/template-launchers.yml"]
  pull_request:
    paths: [pyt, pyt.cmd, pyt.ps1, ".pytemplate/**", ".github/workflows/template-launchers.yml"]
  schedule:
    - cron: "53 4 * * 1" # weekly, Monday 04:53 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.marker.outputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .pytemplate/template-repo
          sparse-checkout-cone-mode: false
      - id: marker
        run: if [ -f .pytemplate/template-repo ]; then echo "template=true" >> "$GITHUB_OUTPUT"; fi

  posix:
    needs: gate
    if: needs.gate.outputs.template == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Extra shells
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          XONSH: ${{ github.event_name == 'schedule' && 'xonsh' || 'xonsh==0.24.2' }}
        run: |
          brew install fish nushell
          uv tool install --python 3.14 "$XONSH"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Shell versions
        run: |
          xonsh --version; fish --version; pwsh --version; uv --version
          nu --version; /bin/bash --version | sed -n 1p
      - name: uv also in ~/.local/bin (the launchers' fallback discovery, T5)
        run: mkdir -p ~/.local/bin && cp "$(command -v uv)" ~/.local/bin/
      - name: selftest --shells
        run: ./pyt selftest --shells
      - name: User-style invocations
        run: |
          for s in /bin/sh bash dash zsh; do "$s" ./pyt help >/dev/null || exit; echo "$s ok"; done
          (cd src && ../pyt help >/dev/null)
          (cd /tmp && "$GITHUB_WORKSPACE/pyt" help >/dev/null)
          env -u UV PATH=/usr/bin:/bin ./pyt help >/dev/null
          /bin/bash ./pyt help >/dev/null; /bin/zsh ./pyt help >/dev/null
          pwsh -NoProfile -Command "./pyt.ps1 help > \$null; exit \$LASTEXITCODE"
          set +e; ./pyt no-such-command; test $? -eq 2

  windows:
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: windows-latest
    env:
      # busybox-w32: the 64-bit build scoop, Chocolatey and winget install. A new release: its
      # file name and its line of https://frippery.org/files/busybox/SHA256SUM (the rolling
      # busybox64u.exe ran whatever frippery.org served that day, unchecked).
      BUSYBOX: busybox-w64-FRP-6075-g169694ebd.exe
      BUSYBOX_SHA256: 07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: uv also in %USERPROFILE%\.local\bin (the launchers' fallback discovery, T5)
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$HOME\.local\bin" | Out-Null; Copy-Item (Get-Command uv).Source "$HOME\.local\bin\"
      - id: msys2
        uses: msys2/setup-msys2@v2
        with: {msystem: UCRT64, release: false, update: false, path-type: minimal, install: dash}
      - uses: cygwin/cygwin-install-action@v6
        with: {install-dir: 'C:\cygwin', packages: dash, add-to-path: false}
      # frippery.org, busybox-w32's only host, is often unreachable from the runners (four tries
      # in a row timed out): the pinned file is kept in the cache, and checked either way
      - id: busybox
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\busybox
          key: busybox-w32-${{ env.BUSYBOX }}-${{ env.BUSYBOX_SHA256 }}
      - name: busybox-w32 (a pinned release, SHA-256 checked)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\busybox"
          $out = "$dir\busybox.exe"
          if (-not (Test-Path $out)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            # frippery.org sometimes times out: retry a few times before failing the job
            for ($i = 1; ; $i++) {
              try { Invoke-WebRequest "https://frippery.org/files/busybox/$env:BUSYBOX" -OutFile $out; break }
              catch { if ($i -ge 4) { throw }; Write-Host "busybox download failed (try $i): $_"; Start-Sleep -Seconds (15 * $i) }
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          if ($hash -ne $env:BUSYBOX_SHA256) {
            Remove-Item $out
            throw "$env:BUSYBOX has SHA-256 $hash, not the pinned $env:BUSYBOX_SHA256"
          }
          Add-Content $env:GITHUB_PATH $dir
      - if: steps.busybox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\busybox
          key: ${{ steps.busybox.outputs.cache-primary-key }}
      - name: xonsh
        shell: bash
        env:
          XONSH: ${{ github.event_name == 'schedule' && 'xonsh' || 'xonsh==0.24.2' }}
        run: |
          uv tool install --python 3.14 "$XONSH"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Shell versions
        shell: bash
        run: |
          (busybox 2>&1 || true) | sed -n 1p
          xonsh --version; pwsh --version; uv --version; bash --version | sed -n 1p
      - name: selftest --shells (cmd, PowerShell 5.1 and 7, Git Bash, MSYS2, Cygwin, busybox-w32, xonsh)
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          CYGWIN_ROOT: 'C:\cygwin'
        run: ./pyt.ps1 selftest --shells
      - shell: cmd
        run: "call pyt.cmd help >nul || exit /b 1\r\ncd src && call ..\\pyt.cmd help >nul"
      - shell: pwsh
        run: "./pyt.ps1 help > $null; Set-Location src; ../pyt.ps1 help > $null"
      - shell: powershell
        run: ".\\pyt.ps1 help > $null; exit $LASTEXITCODE"
      - shell: bash
        run: "./pyt help >/dev/null && (cd src && ../pyt help >/dev/null) && sh ./pyt help >/dev/null && dash ./pyt help >/dev/null"
      - name: MSYS2 login shells, minimal PATH (uv not on PATH)
        shell: msys2 {0}
        run: |
          pacman -Q msys2-runtime dash
          if command -v uv; then echo "uv unexpectedly on PATH"; exit 1; fi
          for m in MSYS UCRT64 MINGW64 CLANG64; do MSYSTEM=$m bash -lc './pyt help >/dev/null' || exit; echo "$m ok"; done
          dash ./pyt help >/dev/null
          (cd src && ../pyt help >/dev/null)
          rc=0; out=$(env -u UV USERPROFILE=/nonexistent LOCALAPPDATA=/nonexistent PATH=/usr/bin ./pyt help 2>&1 </dev/null) || rc=$?
          test "$rc" -eq 127; printf '%s' "$out" | grep -q winget; ! printf '%s' "$out" | grep -q curl
      - name: Cygwin login, no Windows PATH
        shell: pwsh
        env: {CHERE_INVOKING: '1', CYGWIN_NOWINPATH: '1'}
        run: C:\cygwin\bin\bash.exe --login -o igncr -c 'uname -sr && ./pyt help >/dev/null && dash ./pyt help >/dev/null && cd src && ../pyt help >/dev/null'
      - shell: pwsh
        run: "busybox sh -c './pyt help >/dev/null && cd src && ../pyt help >/dev/null'"

  wsl:
    needs: gate
    if: needs.gate.outputs.template == 'true'
    runs-on: windows-latest
    continue-on-error: true  # optional: WSL setup on hosted runners is slow and sometimes flaky
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: Vampire/setup-wsl@v7
        with: {distribution: Ubuntu-24.04, additional-packages: curl dash zsh}
      - shell: wsl-bash {0}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && ./pyt help >/dev/null && dash ./pyt help >/dev/null
      - name: selftest --shells through wsl.exe
        shell: pwsh
        run: ./pyt.ps1 selftest --shells wsl
