# CI of the template repository only (the template- prefix keeps it out of projects made
# with ./pyt new): the LazyVim integration, headless, in an isolated LazyVim (XDG_* under
# a temp dir). For each preset it creates a project, trusts its .lazy.lua through Neovim's
# API, installs the plugins and runs .pytemplate/nvim/tests/smoke.lua.
#
# Pushes and pull requests test pinned versions, so a red run is a regression, not upstream
# drift: Neovim v0.12.5 on Windows here, and v0.12.5 and v0.11.2 (cmd_nvim.MIN_LAZYVIM, the
# documented minimum) on Linux in the CI image (template-ci-image.yml), with the LazyVim starter
# at cmd_nvim.STARTER_REV and the plugins of .pytemplate/nvim/tests/lazy-lock.json. The canary
# (weekly, or by hand) runs the latest of everything: Neovim stable, the starter HEAD and the
# newest plugins. Red there with no commit behind it means upstream changed; green uploads the
# lazy-lock.json and starter-commit.txt that can become the new pins (CLAUDE.md 13.1). template-keepalive.yml keeps the schedule alive. The gate job skips everything in
# repositories made from the template.
name: template-nvim

on:
  push:
    branches: [main]
    paths:
      - ".lazy.lua"
      - ".pytemplate/**"
      - "pyt*"
      - "pytemplate.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/template-nvim.yml"
  pull_request:
    paths:
      - ".lazy.lua"
      - ".pytemplate/**"
      - "pyt*"
      - "pytemplate.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/template-nvim.yml"
  schedule:
    - cron: "47 4 * * 1" # weekly, Monday 04:47 UTC: the canary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.marker.outputs.template }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .pytemplate/template-repo
          sparse-checkout-cone-mode: false
      - id: marker
        run: if [ -f .pytemplate/template-repo ]; then echo "template=true" >> "$GITHUB_OUTPUT"; fi

  nvim:
    name: nvim (${{ matrix.os }}, ${{ matrix.nvim }})
    needs: gate
    if: needs.gate.outputs.template == 'true' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, nvim: v0.12.5} # Linux, with cmd_nvim.MIN_LAZYVIM too: the CI image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Neovim version
        run: nvim --version
      # venv-selector (LazyVim's lang.python extra) raises an error on the first Python buffer
      # without fd, which fails every smoke check that opens one (the CI image has it)
      - name: fd
        run: choco install fd -y --no-progress
      - name: Runner environment
        run: ./pyt setup
      - name: LazyVim smoke test (script, raylib, flet)
        env:
          # short work dir outside the checkout (Windows MAX_PATH; no .lazy.lua above it).
          # The runner context exists only at step level, not in the job's env.
          PT_NVIM_DIR: ${{ runner.temp }}/pt-nvim
        run: ./pyt selftest --nvim --require --dir "$PT_NVIM_DIR"
      - name: Logs of the smoke test
        if: failure() || cancelled()  # a job over its timeout-minutes is cancelled, not failed
        uses: actions/upload-artifact@v7
        with:
          name: nvim-logs-${{ matrix.os }}-${{ matrix.nvim }}
          path: ${{ runner.temp }}/pt-nvim/logs
          if-no-files-found: ignore

  canary:
    name: nvim canary (latest Neovim, starter and plugins)
    needs: gate
    if: needs.gate.outputs.template == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Neovim version
        run: nvim --version
      - name: fd (Ubuntu names it fdfind)
        run: sudo apt-get update && sudo apt-get install -y fd-find
      - name: Runner environment
        run: ./pyt setup
      # Without the lock, selftest --nvim takes the starter HEAD and the newest plugins
      - name: Unpin
        run: rm .pytemplate/nvim/tests/lazy-lock.json
      - name: LazyVim smoke test on the latest of everything
        env:
          PT_NVIM_DIR: ${{ runner.temp }}/pt-nvim
        run: ./pyt selftest --nvim --require --dir "$PT_NVIM_DIR"
      - name: Logs, the resolved lazy-lock.json and starter-commit.txt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvim-canary-logs
          path: ${{ runner.temp }}/pt-nvim/logs
          if-no-files-found: ignore
