description = "2D game with raylib: mypyc-compilable logic, and PyPy (JIT + cffi) by default"

dependencies = ["{package}=={version}"]
# types-cffi: types for `ffi` and _cffi_backend (used by the corrected stub in typings/)
dev_dependencies = ["types-cffi"]

# Defaults for [preset.raylib] in pytemplate.toml
[options]
package = "raylib"   # raylib (GLFW) | raylib_sdl (SDL3) | raylib_software (no macOS wheel): same imports, pick one
version = "6.0.1.0"

# Extra keys for the managed [tool.uv] block
[uv]
# raylib always from a wheel: if one is missing (PyPy 8, PyPy on arm64...) a clear error
# instead of trying to build raylib from source
no-build-package = ["{package}"]

# ./pyt new --clean: the skeleton without the example (bunnymark). The files of clean/ replace
# those of files/, and these keys say what else changes
[clean]
drop = ["src/__pkg__/core/render.py", "src/__pkg__/core/world.py", "tests/test_world.py"]   # files of files/ left out
tasks = ["bunnymark"]               # [tasks] tables of pytemplate.toml left out
buttons = ["run", "test", "build"]  # [vscode] buttons
