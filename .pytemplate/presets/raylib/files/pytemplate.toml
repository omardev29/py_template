# pytemplate.toml: project configuration and working "mode" (raylib preset).
#
# After editing it, run ./pyt apply: it brings the whole project in line (app.name
# renames src/<pkg>/ and its imports, [preset.raylib] replaces the raylib dependency,
# [backend] and [python] re-lock uv.lock and sync the environments, [hooks] installs or
# removes the git hook, and .mypy.ini, pyrightconfig.json, .ruff.toml and .vscode/ are
# regenerated: those also update by themselves on any ./pyt command). ./pyt mode edits
# this file for you. app.preset cannot change in place: ./pyt new DIR --preset P.
schema = 1

[app]
name = "{{name}}"   # executable name; the Python package is src/{{pkg}}/
preset = "raylib"
gui = true          # executable without a console; portable launchers use pythonw/pypyw
assets = "assets"   # src/assets/ is bundled with the app (access: {{pkg}}.resources.asset()); "" = none, no other name

[backend]
# PyPy by default: its JIT speeds up your logic AND the cffi calls into raylib (measured on a
# 30k bunnymark: PyPy 254 fps, mypyc 144, CPython 79). mypyc wins on pure logic.
active = "pypy"
supported = ["cpython", "pypy", "mypyc"]   # with PyPy: Python 3.11 syntax

[python]
cpython = "3.14"
pypy = "pypy@3.11.15"   # EXACT: a newer PyPy can change the extension ABI (8.0: pp80); bump it once your deps ship wheels for it

[typing]
profile = "auto"      # "mypyc" with the mypyc backend; with cpython/pypy, whatever `relaxed` says
relaxed = "off"       # off | warn | strict
editor = "pylance"

# typings/raylib is the corrected raylib stub (./pyt stubs): not checked as your own code
[[typing.mypy_overrides]]
module = ["raylib", "raylib.*"]
ignore_errors = true

[compile]
modules = ["{{pkg}}.core"]   # physics and draw loop: the hot code
exclude = []
forbid_imports = ["pyray"]   # pyray wraps every call in Python (~7x slower than raylib)
annotate = false
# opt_level: mypyc's C optimization. MSVC: 1, 2 and 3 are all /O2
opt_level = "3"   # 0 (debug only, slower than CPython) | 1 | 2 | 3 (default)
no_semantic_interposition = true   # Linux gcc/clang: calls between compiled functions may be inlined

[deploy]
# optimize: Python's -O level of the exe, nuitka and portable builds (higher = MORE stripped,
# not faster); with mypyc, 1 and 2 also strip the compiled modules' asserts in every method
optimize = 1   # 0 keep asserts | 1 strip asserts | 2 also docstrings
default = { cpython = "exe", mypyc = "exe", pypy = "portable" }
exclude_modules = []   # never bundled by exe/nuitka even if imported, e.g. "ssl" without HTTPS

[deploy.exe]
mode = "onedir"   # starts instantly (onefile unpacks itself on every run)
console = "auto"
icon = ""   # .ico (Windows: exe, nuitka) or .icns (a macOS .app: exe); ignored on Linux
strip = false   # Linux/macOS: strip symbol tables of the bundled binaries (smaller)
# cffi pulls in setuptools/pycparser, which the game does not need at runtime
extra_args = ["--exclude-module", "setuptools", "--exclude-module", "pycparser", "--exclude-module", "_distutils_hack"]

[deploy.portable]
runtime = "bundled"

[deploy.pyz]
targets = ["host"]   # e.g. add "cp314-linux-x86_64" to include the Linux raylib

[deploy.nuitka]
lto = "auto"    # auto | yes | no: link-time optimization (auto: yes up to 250 compiled modules; raylib: ~20)
pgo = false     # profile-guided C: needs app.gui = false and no assets (the build runs the app once)
pgo_args = []   # the app's arguments for that profiling run

[deploy.upx]
# UPX packs the exe/dll/pyd (and ELF executables) of the nuitka, portable and flet methods, and
# of exe on Windows only: smaller files; every start unpacks them in memory and some antivirus
# engines flag them. Binaries over 600 MiB are never packed (UPX's limit is 768 MiB).
enabled = false
level = "best"   # 1..9 | best | brute | ultra-brute (brute: much slower, a few % smaller)
lzma = true      # smaller, slower to unpack (PyInstaller and Nuitka always use LZMA)
exclude = []     # extra file-name globs never packed (C runtime and python3*.dll never are)
# path = "tools/upx"   # a UPX binary, relative to the project root (default: PATH, then a pinned download)

[preset.raylib]
# ./pyt apply replaces the dependency in pyproject.toml with {package}=={version} and re-locks
package = "raylib"   # raylib (GLFW) | raylib_sdl (SDL3) | raylib_software (Linux and Windows only)
version = "6.0.1.0"

[hooks]
# true: ./pyt apply (and setup) installs a git pre-commit hook that runs ./pyt hooks run
# (ruff, format, generated files, lock); false: ./pyt apply removes pytemplate's hook
pre_commit = true

[vscode]
# Status bar buttons (VS Code extension actboy168.tasks): ./pyt commands or [tasks] names
buttons = ["run", "bunnymark", "test", "build"]

[tasks.stubs]
help = "Regenerate typings/raylib (the corrected raylib stub) after changing versions"
cmd = ["python", ".pytemplate/presets/raylib/tools/raylib_stubs.py", "typings/raylib/__init__.pyi"]
backend = "cpython"

[tasks.bunnymark]
help = "Measure FPS with 30,000 bunnies and 900 frames (other backend: ./pyt run mypyc --frames 900 --bunnies 30000)"
deps = ["run --frames 900 --bunnies 30000"]   # a ./pyt command: with mypyc, it compiles first

[tasks.ci]
help = "Same as CI: check and tests on every backend"
deps = ["check all", "test all"]
