# pytest settings of the runner's own tests (./pyt selftest, selftest --mutation), never the
# project's: cli.cmd_selftest and mutation.Runs.run start pytest with -c on this file and
# --rootdir=. in the project folder, so the settings a project gives its app's tests
# (pyproject.toml [tool.pytest.ini_options], pytest.ini, tox.ini or setup.cfg: a coverage gate,
# python_files, plugins) and its root conftest.py never reach these tests, and a test id stays
# .pytemplate/tests/test_x.py::test_y.
[pytest]
addopts = -ra
