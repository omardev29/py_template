[project]
name = "miapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.3",
    "setuptools>=84.0.0",
]

[tool.mypy]
strict = true
files = ["src", "build.py"]
# src/ no es un paquete: sus módulos se importan por nombre (`from app import main`).
# mypy ya lo deduce de la ruta del archivo; esto solo lo deja explícito.
mypy_path = "src"
